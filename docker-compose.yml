services:
  postgres_db:
    image: postgres:13.5-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5434:5432
    volumes:
      - birthdayapp_data:/var/lib/postgresql/data

volumes:
  birthdayapp_data:
